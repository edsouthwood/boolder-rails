default: &default
  adapter: postgis
  encoding: unicode
  postgis_extension: postgis      # default is postgis
  postgis_schema: public          # default is public
  schema_search_path: public,postgis
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: dartmoor-dev

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: boolder-test

# With no DB_HOST/POSTGRES_USER set, connections go over the local unix socket
# as the OS user (peer auth) — the same way development connects. Set the env
# vars when pointing at an external/containerised database (e.g. Kamal).
production:
  primary:
    <<: *default
    database: dartmoor-production
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cache:
    <<: *default
    database: dartmoor-cache
    migrations_paths: db/cache_migrate
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  queue:
    <<: *default
    database: dartmoor-queue
    migrations_paths: db/queue_migrate
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cable:
    <<: *default
    database: dartmoor-cable
    migrations_paths: db/cable_migrate
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>